version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: campushub_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campushub_db}
      POSTGRES_USER: ${POSTGRES_USER:-campushub_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campushub_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campushub_user} -d ${POSTGRES_DB:-campushub_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: campushub_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campushub_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             daphne -b 0.0.0.0 -p 8000 campushub.asgi:application"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-django-insecure-docker-prod-key-campushub-2026}
      - DATABASE_URL=postgres://${POSTGRES_USER:-campushub_user}:${POSTGRES_PASSWORD:-campushub_secret}@db:5432/${POSTGRES_DB:-campushub_db}
      - REDIS_URL=redis://redis:6379/0
      - USE_REDIS_CHANNEL_LAYER=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend,campushub-backend
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/health/ping/\")'"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campushub_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:

