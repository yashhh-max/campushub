version: '3.8'

# ==============================================================================
# KPRIT CAMPUSHUB — 10,000 CONCURRENT USERS HIGH-AVAILABILITY CLUSTER
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Primary Database Engine (PostgreSQL 16)
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: campushub_db
    restart: unless-stopped
    command: >
      postgres
        -c max_connections=200
        -c shared_buffers=512MB
        -c effective_cache_size=1536MB
        -c work_mem=16MB
        -c maintenance_work_mem=128MB
        -c min_wal_size=1GB
        -c max_wal_size=4GB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c default_statistics_target=100
        -c random_page_cost=1.1
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campushub_db}
      POSTGRES_USER: ${POSTGRES_USER:-campushub_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campushub_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campushub_user} -d ${POSTGRES_DB:-campushub_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # PostgreSQL Connection Pooler (PgBouncer)
  # ----------------------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:v1.22.1
    container_name: campushub_pgbouncer
    restart: unless-stopped
    environment:
      DB_USER: ${POSTGRES_USER:-campushub_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-campushub_secret}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-campushub_db}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 2048
      DEFAULT_POOL_SIZE: 50
      MIN_POOL_SIZE: 10
      RESERVE_POOL_SIZE: 15
      AUTH_TYPE: plain
    ports:
      - "6432:6432"
    depends_on:
      db:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # Shared Cache & Channel Layer (Redis 7)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: campushub_redis
    restart: unless-stopped
    command: >
      redis-server
        --maxmemory 2gb
        --maxmemory-policy allkeys-lru
        --appendonly yes
        --tcp-backlog 2048
        --timeout 0
        --tcp-keepalive 300
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # Horizontally Scaled Stateless Backend Application Replicas (Daphne ASGI)
  # ----------------------------------------------------------------------------
  backend_1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campushub_backend_1
    restart: unless-stopped
    command: daphne -b 0.0.0.0 -p 8000 campushub.asgi:application
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-django-insecure-docker-prod-key-campushub-2026}
      - DATABASE_URL=postgres://${POSTGRES_USER:-campushub_user}:${POSTGRES_PASSWORD:-campushub_secret}@pgbouncer:6432/${POSTGRES_DB:-campushub_db}
      - REDIS_URL=redis://redis:6379/0
      - USE_REDIS_CHANNEL_LAYER=True
      - ALLOWED_HOSTS=*
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://campushub.kprit,https://campushub.kprit,http://api.campushub.kprit,https://api.campushub.kprit
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy

  backend_2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campushub_backend_2
    restart: unless-stopped
    command: daphne -b 0.0.0.0 -p 8000 campushub.asgi:application
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-django-insecure-docker-prod-key-campushub-2026}
      - DATABASE_URL=postgres://${POSTGRES_USER:-campushub_user}:${POSTGRES_PASSWORD:-campushub_secret}@pgbouncer:6432/${POSTGRES_DB:-campushub_db}
      - REDIS_URL=redis://redis:6379/0
      - USE_REDIS_CHANNEL_LAYER=True
      - ALLOWED_HOSTS=*
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://campushub.kprit,https://campushub.kprit,http://api.campushub.kprit,https://api.campushub.kprit
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy

  backend_3:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campushub_backend_3
    restart: unless-stopped
    command: daphne -b 0.0.0.0 -p 8000 campushub.asgi:application
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-django-insecure-docker-prod-key-campushub-2026}
      - DATABASE_URL=postgres://${POSTGRES_USER:-campushub_user}:${POSTGRES_PASSWORD:-campushub_secret}@pgbouncer:6432/${POSTGRES_DB:-campushub_db}
      - REDIS_URL=redis://redis:6379/0
      - USE_REDIS_CHANNEL_LAYER=True
      - ALLOWED_HOSTS=*
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://campushub.kprit,https://campushub.kprit,http://api.campushub.kprit,https://api.campushub.kprit
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy

  backend_4:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campushub_backend_4
    restart: unless-stopped
    command: daphne -b 0.0.0.0 -p 8000 campushub.asgi:application
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-django-insecure-docker-prod-key-campushub-2026}
      - DATABASE_URL=postgres://${POSTGRES_USER:-campushub_user}:${POSTGRES_PASSWORD:-campushub_secret}@pgbouncer:6432/${POSTGRES_DB:-campushub_db}
      - REDIS_URL=redis://redis:6379/0
      - USE_REDIS_CHANNEL_LAYER=True
      - ALLOWED_HOSTS=*
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://campushub.kprit,https://campushub.kprit,http://api.campushub.kprit,https://api.campushub.kprit
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # Asynchronous Background Task Workers (Celery)
  # ----------------------------------------------------------------------------
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campushub_celery_worker
    restart: unless-stopped
    command: celery -A campushub worker -l info --concurrency=4 -Q default,emails,notifications
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-django-insecure-docker-prod-key-campushub-2026}
      - DATABASE_URL=postgres://${POSTGRES_USER:-campushub_user}:${POSTGRES_PASSWORD:-campushub_secret}@pgbouncer:6432/${POSTGRES_DB:-campushub_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campushub_celery_beat
    restart: unless-stopped
    command: celery -A campushub beat -l info
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-django-insecure-docker-prod-key-campushub-2026}
      - DATABASE_URL=postgres://${POSTGRES_USER:-campushub_user}:${POSTGRES_PASSWORD:-campushub_secret}@pgbouncer:6432/${POSTGRES_DB:-campushub_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # Next.js Frontend Cluster
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campushub_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api.campushub.kprit
      - NEXT_PUBLIC_WS_URL=ws://api.campushub.kprit
    depends_on:
      - backend_1

  # ----------------------------------------------------------------------------
  # Production Load Balancer & Reverse Proxy (Nginx)
  # ----------------------------------------------------------------------------
  nginx_lb:
    image: nginx:1.25-alpine
    container_name: campushub_load_balancer
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/campushub_10k_ha.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend_1
      - backend_2
      - backend_3
      - backend_4
      - frontend

volumes:
  postgres_data:
  redis_data:
