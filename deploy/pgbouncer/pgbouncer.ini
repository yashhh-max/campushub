[databases]
campushub_db = host=db port=5432 dbname=campushub_db

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

# Connection Pooling Settings for 10,000 Concurrent Users
pool_mode = transaction
max_client_conn = 2048
default_pool_size = 50
min_pool_size = 10
reserve_pool_size = 15
reserve_pool_timeout = 5
max_db_connections = 100

# Timeouts & Keepalive
server_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 3
client_idle_timeout = 120
client_login_timeout = 30
query_timeout = 60
idle_transaction_timeout = 30

# Log & Admin Settings
admin_users = campushub_user
stats_users = campushub_user
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
