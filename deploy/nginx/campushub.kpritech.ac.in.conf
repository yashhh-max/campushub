# ==============================================================================
# Nginx Reverse Proxy & SSL Configuration for KPRIT CampusHub
# Domain: campushub.kpritech.ac.in / api.campushub.kpritech.ac.in
# ==============================================================================

# Rate Limiting Zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# Upstream Application Services
upstream campushub_frontend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream campushub_backend {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. HTTP -> HTTPS Global Redirection
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name campushub.kpritech.ac.in api.campushub.kpritech.ac.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. Frontend Application Server (campushub.kpritech.ac.in)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name campushub.kpritech.ac.in;

    # Institutional TLS Certificates (Replace with KPRIT-issued certs or Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/campushub.kpritech.ac.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campushub.kpritech.ac.in/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # Gzip Compression
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        proxy_pass http://campushub_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

# ------------------------------------------------------------------------------
# 3. Backend API & WebSocket Server (api.campushub.kpritech.ac.in)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.campushub.kpritech.ac.in;

    ssl_certificate /etc/letsencrypt/live/api.campushub.kpritech.ac.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.campushub.kpritech.ac.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 25M;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Static Assets collected by Django
    location /static/ {
        alias /var/www/campushub/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # User Media (Resumes, Posters)
    location /media/ {
        alias /var/www/campushub/backend/media/;
        expires 7d;
        add_header Cache-Control "private, max-age=604800";
    }

    # Authentication Throttling
    location /api/auth/login/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://campushub_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # REST APIs
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://campushub_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Django Channels WebSockets
    location /ws/ {
        proxy_pass http://campushub_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Health Check Endpoint
    location /api/health/ {
        proxy_pass http://campushub_backend;
        proxy_set_header Host $host;
        access_log off;
    }
}
