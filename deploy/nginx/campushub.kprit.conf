# ==============================================================================
# Nginx Reverse Proxy Configuration for KPRIT CampusHub
# Domain: campushub.kprit / api.campushub.kprit
# Compatible with local intranet DNS, private college networks, and production reverse proxy
# ==============================================================================

# Rate Limiting Zones
limit_req_zone $binary_remote_addr zone=kprit_api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=kprit_auth_limit:10m rate=5r/s;

# Upstream Services
upstream campushub_kprit_frontend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream campushub_kprit_backend {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. Frontend Server — campushub.kprit (Port 80 HTTP / Campus Intranet)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name campushub.kprit www.campushub.kprit;

    # Gzip Compression
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Next.js Static Optimization Buffering
    location /_next/static/ {
        proxy_pass http://campushub_kprit_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
    }

    # Frontend Application Reverse Proxy
    location / {
        proxy_pass http://campushub_kprit_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

# ------------------------------------------------------------------------------
# 2. Backend API & WebSocket Server — api.campushub.kprit (Port 80 HTTP)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.campushub.kprit;

    client_max_body_size 50M;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Django Channels Real-Time WebSocket Endpoint
    location /ws/ {
        proxy_pass http://campushub_kprit_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Auth Endpoints Rate Limiting
    location ~* ^/api/(token|auth|register|login)/ {
        limit_req zone=kprit_auth_limit burst=10 nodelay;
        proxy_pass http://campushub_kprit_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # General API Endpoints
    location /api/ {
        limit_req zone=kprit_api_limit burst=50 nodelay;
        proxy_pass http://campushub_kprit_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Django Administration & Static Assets
    location /admin/ {
        proxy_pass http://campushub_kprit_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://campushub_kprit_backend;
        expires 30d;
        access_log off;
    }

    location /media/ {
        proxy_pass http://campushub_kprit_backend;
        expires 30d;
    }

    # Default fallback for health check
    location / {
        proxy_pass http://campushub_kprit_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
