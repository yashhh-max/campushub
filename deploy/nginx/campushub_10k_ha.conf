# ==============================================================================
# KPRIT CampusHub — 10,000 Concurrent Users High-Availability Nginx Config
# Architecture: Dual-tier Reverse Proxy + Load Balancer + WebSocket Director
# ==============================================================================

# Worker performance tuning (apply in main nginx.conf if standalone):
# worker_processes auto;
# worker_rlimit_nofile 65535;
# events {
#     worker_connections 16384;
#     multi_accept on;
#     use epoll;
# }

# ------------------------------------------------------------------------------
# Rate Limiting & Abuse Prevention Zones (Calibrated for 10k Concurrency)
# ------------------------------------------------------------------------------
# 25 req/s per IP burstable up to 60 for student login surges
limit_req_zone $binary_remote_addr zone=campushub_10k_auth:20m rate=25r/s;

# 150 req/s per IP burstable up to 250 for heavy API dashboard/event browsing
limit_req_zone $binary_remote_addr zone=campushub_10k_api:30m rate=150r/s;

# Concurrent connection limit per IP to mitigate DoS / slowloris attacks
limit_conn_zone $binary_remote_addr zone=campushub_conn_limit:20m;

# ------------------------------------------------------------------------------
# Upstream Clustered Backend Pool (Horizontally Scaled Daphne Instances)
# ------------------------------------------------------------------------------
upstream campushub_backend_cluster {
    least_conn;

    server 127.0.0.1:8001 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8002 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8003 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8004 max_fails=3 fail_timeout=10s;

    # Persistent HTTP/1.1 connections to backends
    keepalive 128;
}

# Clustered Next.js Frontend Server Pool
upstream campushub_frontend_cluster {
    least_conn;

    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:3001 max_fails=3 fail_timeout=10s backup;

    keepalive 64;
}

# ------------------------------------------------------------------------------
# 1. Frontend Web App — campushub.kprit / campus intranet
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name campushub.kprit www.campushub.kprit campushub.kpritech.ac.in;

    # Connection limits
    limit_conn campushub_conn_limit 100;

    # High-throughput Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # Enterprise Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Next.js Static Optimization Assets (Immutable 1-Year Cache)
    location /_next/static/ {
        proxy_pass http://campushub_frontend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Static Public Assets (Images, Favicons, Fonts)
    location /static/ {
        proxy_pass http://campushub_frontend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        access_log off;
    }

    # Dynamic Next.js SSR & Client Navigation
    location / {
        proxy_pass http://campushub_frontend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Resilient Upstream Retries
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }
}

# ------------------------------------------------------------------------------
# 2. Clustered Backend API & WebSocket Gateway — api.campushub.kprit
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.campushub.kprit;

    client_max_body_size 50M;
    limit_conn campushub_conn_limit 100;

    # Gzip for JSON and XML API responses
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types application/json application/xml text/plain;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Django Channels WebSocket Gateway (/ws/)
    location /ws/ {
        proxy_pass http://campushub_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for real-time WebSocket frames
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 10s;
    }

    # Lightweight Liveness Probe for Load Balancers & Orchestrators
    location = /api/health/ping/ {
        proxy_pass http://campushub_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        access_log off;
    }

    # Comprehensive System Health Check
    location = /api/health/ {
        proxy_pass http://campushub_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    # Authentication Endpoints Rate Limiting (Token / Login / Register)
    location ~* ^/api/(token|auth|register|login)/ {
        limit_req zone=campushub_10k_auth burst=60 nodelay;
        proxy_pass http://campushub_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # General High-Throughput REST API
    location /api/ {
        limit_req zone=campushub_10k_api burst=250 nodelay;
        proxy_pass http://campushub_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Failover and connection pooling
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_connect_timeout 5s;
        proxy_read_timeout 45s;
        proxy_send_timeout 45s;

        # Optimized buffer sizes for API payloads
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }

    # Django Admin Interface
    location /admin/ {
        limit_req zone=campushub_10k_auth burst=20 nodelay;
        proxy_pass http://campushub_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Django Static Files
    location /static/ {
        proxy_pass http://campushub_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Django Media Files
    location /media/ {
        proxy_pass http://campushub_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        expires 14d;
        add_header Cache-Control "public, max-age=1209600";
        access_log off;
    }
}
