services:
  - type: web
    name: campushub-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate && python manage.py seed_demo && daphne -b 0.0.0.0 -p $PORT campushub.asgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: CORS_ALLOWED_ORIGINS
        value: https://frontend-psi-roan-84.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://frontend-psi-roan-84.vercel.app,https://*.onrender.com
      - key: USE_REDIS_CHANNEL_LAYER
        value: "True"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ALLOWED_STUDENT_EMAIL_DOMAINS
        value: "*"
